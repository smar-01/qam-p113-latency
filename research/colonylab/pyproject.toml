[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "colonylab"
version = "0.1.0"
description = "Exploratory anonymous execution patterns and market response horizons"
requires-python = ">=3.11"
dependencies = ["databento>=0.88,<1", "numpy>=1.24", "pandas>=1.5", "scipy>=1.15,<2", "scikit-learn>=1.2", "matplotlib>=3.6", "threadpoolctl>=3.1", "statsmodels>=0.14.4,<0.15"]

[project.scripts]
colonylab = "colonylab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

